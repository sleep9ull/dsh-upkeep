# dsh-upkeep bundle patch.
#
# One Host row owns every upkeep operation; the Web Client half is declared by
# `dsh.client` in package.json and reaches this row through the `/api/upkeep`
# Fetch route. Reads are safe by default; writes (upgrade, push, merge) are
# guarded by an explicit confirmation in the panel and by approval in the tool.
- insert:
    - id: upkeep
      name: "@sleep9ull/dsh-upkeep"
      config:
        targetChannel: auto
        checkOnStartup: true
        concurrency: 2
        worktreeRoot: ""
        # Empty means "auto-detect from ~/.gitconfig and the gh login"; set an
        # explicit comma-separated list when those accounts do not identify you.
        ownerHandles: ""
        ownerEmails: ""
        autoDetectOwner: true
        # Empty means "ask the npm registry which DSH release to compare against".
        # Set an exact version to pin the comparison target offline.
        targetVersion: ""
        feedTtlMinutes: 60
        checksToKeep: 20
